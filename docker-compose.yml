services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mvp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 2
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:-"-Xmx512m -Xms512m"}
      CLUSTER_ID: mvpkafka00000000000000000000
    ports:
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SAGA_URL: http://saga:8085
      RISK_URL: http://risk:8084
      PAYMENT_URL: http://payment:8083
      CONTROLLER_URL: http://reliability-controller:8086
      ENV: local
    depends_on:
      - saga
      - risk

  order:
    build:
      context: .
      dockerfile: ./apps/order/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mvp?sslmode=disable
      KAFKA_BROKER: kafka:9092
      SERVICE: order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  inventory:
    build:
      context: .
      dockerfile: ./apps/inventory/Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mvp?sslmode=disable
      KAFKA_BROKER: kafka:9092
      SERVICE: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payment:
    build:
      context: .
      dockerfile: ./apps/payment/Dockerfile
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mvp?sslmode=disable
      KAFKA_BROKER: kafka:9092
      SERVICE: payment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  risk:
    build:
      context: .
      dockerfile: ./apps/risk/Dockerfile
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mvp?sslmode=disable
      KAFKA_BROKER: kafka:9092
      SERVICE: risk-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  saga:
    build:
      context: .
      dockerfile: ./apps/saga/Dockerfile
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mvp?sslmode=disable
      KAFKA_BROKER: kafka:9092
      INVENTORY_URL: http://inventory:8082
      PAYMENT_URL: http://payment:8083
      RISK_URL: http://risk:8084
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  safety-shield:
    build:
      context: .
      dockerfile: ./apps/safety-shield/Dockerfile
    ports:
      - "8087:8087"
    environment:
      PORT: 8087

  ml-service:
    build:
      context: ./ai/ml
      dockerfile: ./service/Dockerfile
    ports:
      - "9000:9000"
    environment:
      MODEL_DIR: /app/models

  reliability-controller:
    build:
      context: .
      dockerfile: ./apps/reliability-controller/Dockerfile
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mvp?sslmode=disable
      GATEWAY_URL: http://gateway:8080
      RISK_URL: http://risk:8084
      SHIELD_URL: http://safety-shield:8087
      ML_URL: http://ml-service:9000
      CONTROLLER_INTERVAL: ${CONTROLLER_INTERVAL:-15s}
      VERIFY_AFTER: ${VERIFY_AFTER:-30s}
      RISK_THRESHOLD: ${RISK_THRESHOLD:-0.60}
      DB_CONN_THRESHOLD: ${DB_CONN_THRESHOLD:-0.70}
      COOLDOWN: ${COOLDOWN:-60s}
      ACTION_BUDGET: ${ACTION_BUDGET:-3}
      BASELINE_MODE: ${BASELINE_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      safety-shield:
        condition: service_started
      ml-service:
        condition: service_started
      gateway:
        condition: service_started

  genai:
    build: ./ai/service
    ports:
      - "9001:9001"
    environment:
      PORT: 9001
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mvp?sslmode=disable
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_GEN_MODEL: ${OPENROUTER_GEN_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS}
      OPENROUTER_EMBED_MODEL: ${OPENROUTER_EMBED_MODEL:-openai/text-embedding-3-small}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE}
      GENAI_OFFLINE_MOCK: ${GENAI_OFFLINE_MOCK:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  pgdata:
